<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahali — Phase 1 UI Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
/* Colours are taken from the Mahali brand board:
   yellow #dbd670 · bright yellow #ebe979 · light beige #f1f0dc · dark beige #e4dfbe
   green #41ccb0 / #30cdb0 · darker brown #3d3b3a · lighter brown #7d5738
   forest / pine / mist / cream / brick / gold are derived shades so text and buttons stay readable on the palette greens. */
tailwind.config={theme:{extend:{
  colors:{
    sun:{DEFAULT:'#dbd670',bright:'#ebe979'}, beige:'#f1f0dc', sand:'#e4dfbe',
    mint:{DEFAULT:'#41ccb0',aqua:'#30cdb0'}, bark:'#3d3b3a', clay:'#7d5738',
    forest:{DEFAULT:'#2f7a63',dark:'#266552'}, pine:'#1f4d3f', mist:'#e6f7f2', cream:'#fbfaf3',
    brick:'#b4533a', gold:'#e3c13c'
  },
  fontFamily:{sans:['Inter','system-ui','sans-serif'],head:['Poppins','Inter','system-ui','sans-serif'],display:['Lora','Georgia','serif']}
}}}
</script>
<style type="text/tailwindcss">
@layer components{
  .btn{@apply inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold font-head transition active:scale-[.98] disabled:opacity-50 disabled:pointer-events-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-mint focus-visible:ring-offset-2 focus-visible:ring-offset-cream}
  .btn-primary{@apply bg-forest text-white hover:bg-forest-dark shadow-sm}
  .btn-secondary{@apply bg-sun text-bark hover:bg-sun-bright}
  .btn-outline{@apply border border-mint bg-white text-forest hover:bg-mist}
  .btn-ghost{@apply text-forest hover:bg-mist}
  .btn-danger{@apply bg-brick text-white hover:opacity-90}
  .btn-sm{@apply px-3 py-1.5 text-xs rounded-lg}
  .card{@apply bg-white border border-sand/70 rounded-2xl}
  .input{@apply w-full min-w-0 rounded-xl border border-sand bg-white px-3.5 py-2.5 text-sm text-bark placeholder:text-bark/40 focus:outline-none focus:border-mint focus:ring-2 focus:ring-mint/30}
  .label{@apply block text-xs font-semibold text-bark/70 mb-1.5 font-head}
  .chip{@apply inline-flex items-center gap-1 rounded-full bg-beige px-2.5 py-1 text-xs font-medium text-bark/80}
  .chip-on{@apply bg-forest text-white}
  .navlink.on{@apply text-forest bg-mist}
  .h1d{@apply font-display font-bold text-pine tracking-tight}
}
:root{--bg:#fbfaf3;--ink:#3d3b3a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px)}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.card-shadow{box-shadow:0 1px 2px rgba(61,59,58,.04),0 10px 28px -14px rgba(61,59,58,.16)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.anim-up{animation:up .2s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[100] btn btn-primary">Skip to content</a>

<script>
'use strict';
const ICONS={

mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/>',
check:'<path d="M20 6 9 17l-5-5"/>',

xcircle:'<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',

trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',

grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><path d="M12 9v4M12 17h.01"/>',
info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
ban:'<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
refresh:'<path d="M21 12a9 9 0 0 0-15-6.7L3 8M3 3v5h5M3 12a9 9 0 0 0 15 6.7L21 16M21 21v-5h-5"/>',
eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
coffee:'<path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 2v3M10 2v3M14 2v3"/>'
};
const ic=(n,c='w-5 h-5')=>`<svg class="${c} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;
const STAR=ICONS.star.match(/points="([^"]+)"/)[1];
const starF=(c='w-4 h-4')=>`<svg class="${c}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="${STAR}"/></svg>`;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const A={},F={},I={};
const S=Object.assign({user:null},(()=>{try{return JSON.parse(localStorage.getItem('mahali_sow'))||{}}catch(e){return{}}})());
const persist=()=>{try{localStorage.setItem('mahali_sow',JSON.stringify(S))}catch(e){}};
const role=()=>S.user?S.user.role:'visitor';
let CUR={path:'/'};

/* ── helpers ── */
function toast(msg,type='ok'){const el=document.createElement('div');el.className='anim-up pointer-events-auto flex items-center gap-2 rounded-xl px-4 py-3 text-sm font-medium shadow-lg max-w-sm '+(type==='err'?'bg-brick text-white':'bg-pine text-white');el.setAttribute('role','status');el.innerHTML=ic(type==='err'?'alert':'checkcircle','w-4 h-4')+`<span>${esc(msg)}</span>`;$('#toast-root').appendChild(el);setTimeout(()=>el.remove(),3400)}
function modal(html,o={}){$('#modal-root').innerHTML=`<div class="fixed inset-0 z-[70] flex items-end sm:items-center justify-center" role="dialog" aria-modal="true"><div class="absolute inset-0 bg-bark/50" data-act="close"></div><div class="relative anim-up w-full ${o.w||'sm:max-w-md'} max-h-[92vh] overflow-y-auto bg-cream rounded-t-3xl sm:rounded-3xl p-5 sm:p-6 shadow-2xl" style="padding-bottom:calc(1.25rem + env(safe-area-inset-bottom,0px))">${html}</div></div>`;document.body.style.overflow='hidden'}
function closeModal(){const r=$('#modal-root');if(r&&r.innerHTML){r.innerHTML='';document.body.style.overflow=''}}
const mHead=(t,s)=>`<div class="flex items-start justify-between gap-4 mb-4"><div class="min-w-0"><h2 class="font-head font-semibold text-lg text-pine">${t}</h2>${s?`<p class="text-sm text-bark/60 mt-0.5">${s}</p>`:''}</div><button data-act="close" class="btn btn-ghost !p-2 -mr-2 -mt-1" aria-label="Close">${ic('x')}</button></div>`;
let CONF=null;
function confirmBox(o){CONF=o.ok;modal(`${mHead(o.title,o.text)}<div class="flex gap-2 justify-end mt-2"><button data-act="close" class="btn btn-outline">Cancel</button><button data-act="confirmOk" class="btn ${o.danger?'btn-danger':'btn-primary'}">${o.label||'Confirm'}</button></div>`)}
A.close=()=>closeModal();A.confirmOk=()=>{const f=CONF;CONF=null;closeModal();f&&f()};
const RESTRICTED=['scam','fake','counterfeit'];/* placeholder — Mahali supplies the real restricted-word list */
const restricted=t=>RESTRICTED.find(w=>new RegExp('\\b'+w+'\\b','i').test(t||''));
const rw=v=>restricted(v)?'This contains a restricted word. Please remove it to continue.':'';
function fld(o){const id='f_'+o.n;let attr=o.attr||'',cnt='';if(o.max){attr+=` maxlength="${o.max}" data-input="cnt"`;cnt=`<span class="text-[11px] text-bark/50" data-cnt="${o.n}">${(o.v||'').length} / ${o.max}</span>`}
 let inner;if(o.opts)inner=`<select id="${id}" name="${o.n}" class="input" ${attr}>${o.opts.map(x=>{const [v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${v==o.v?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
 else if(o.rows)inner=`<textarea id="${id}" name="${o.n}" rows="${o.rows}" class="input" placeholder="${esc(o.ph||'')}" ${attr}>${esc(o.v||'')}</textarea>`;
 else inner=`<div class="relative">${o.ic?`<span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-bark/40">${ic(o.ic,'w-4 h-4')}</span>`:''}<input id="${id}" name="${o.n}" type="${o.t||'text'}" placeholder="${esc(o.ph||'')}" value="${esc(o.v||'')}" autocomplete="${o.ac||'off'}" class="input ${o.ic?'!pl-10':''}" ${attr}></div>`;
 return `<div class="${o.cls||''}"><div class="flex items-end justify-between gap-2 mb-1.5"><label class="label !mb-0" for="${id}">${o.l}${o.req?' <span class="text-brick">*</span>':''}</label>${cnt}</div>${inner}${o.hint?`<p class="text-[11px] text-bark/50 mt-1">${o.hint}</p>`:''}<p class="text-xs text-brick mt-1 hidden" data-err="${o.n}" role="alert"></p></div>`}
I.cnt=t=>{const c=$(`[data-cnt="${t.name}"]`);if(c)c.textContent=t.value.length+' / '+t.maxLength};
const pwFld=(n,l,ac)=>`<div><label class="label" for="f_${n}">${l} <span class="text-brick">*</span></label><div class="relative"><span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-bark/40">${ic('lock','w-4 h-4')}</span><input id="f_${n}" name="${n}" type="password" autocomplete="${ac}" class="input !pl-10 !pr-11"><button type="button" data-act="pwtoggle" class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 text-bark/50 hover:text-forest" aria-label="Show password">${ic('eye','w-4 h-4')}</button></div><p class="text-xs text-brick mt-1 hidden" data-err="${n}" role="alert"></p></div>`;
A.pwtoggle=t=>{const i=t.parentElement.querySelector('input');i.type=i.type==='password'?'text':'password'};
function collect(root){const d={};$$('[name]',root).forEach(el=>{if(el.type==='checkbox')d[el.name]=el.checked;else if(el.type==='radio'){if(el.checked)d[el.name]=el.value}else if(el.type!=='file')d[el.name]=el.value});return d}
function check(root,rules){const d=collect(root);let ok=true;$$('[data-err]',root).forEach(e=>{e.classList.add('hidden');e.textContent=''});$$('.input',root).forEach(e=>e.classList.remove('!border-brick'));
 for(const k in rules){for(const r of rules[k]){const v=String(d[k]==null?'':d[k]).trim();let m='';
  if(typeof r==='function')m=r(v,d);
  else if(r==='req'&&!v)m='This field is required.';
  else if(r==='email'&&v&&!/^\S+@\S+\.\S+$/.test(v))m='Enter a valid email, like name@example.com.';
  else if(r==='phone'&&v&&!/^\+?[0-9 ]{8,15}$/.test(v))m='Enter a valid phone number, like +971 50 123 4567.';
  else if(r==='min8'&&v.length<8)m='Use at least 8 characters.';
  else if(r==='price'&&v&&!/^\d{1,8}(\.\d{1,2})?$/.test(v))m='Enter a price with up to two decimal places, like 25.50.';
  if(m){ok=false;const e=$(`[data-err="${k}"]`,root);if(e){e.textContent=m;e.classList.remove('hidden')}const i=$(`[name="${k}"]`,root);if(i)i.classList.add('!border-brick');break}}}
 if(!ok){const f=$('[data-err]:not(.hidden)',root);if(f)f.scrollIntoView({block:'center',behavior:'smooth'})}
 return ok?d:null}
A.submit=t=>{const c=t.closest('[data-form]');if(c&&F[c.dataset.form])F[c.dataset.form](c,t)};

/* ── ui bits ── */
const stars=(r,c='w-4 h-4')=>{let s='';for(let i=1;i<=5;i++){const f=r>=i?100:r>i-1?Math.round((r-i+1)*100):0;s+=`<span class="relative inline-block ${c}"><span class="text-sand">${starF(c)}</span><span class="absolute inset-0 overflow-hidden text-gold" style="width:${f}%">${starF(c)}</span></span>`}return `<span class="inline-flex gap-0.5" role="img" aria-label="Rated ${r} out of 5">${s}</span>`};
let _g=0;const PAL=[['#dbd670','#41ccb0'],['#e4dfbe','#30cdb0'],['#ebe979','#7d5738'],['#41ccb0','#2f7a63'],['#f1f0dc','#dbd670'],['#7d5738','#dbd670'],['#30cdb0','#dbd670']];
function art(h,icon='store'){const [a,b]=PAL[Math.abs(h)%PAL.length],g='g'+(++_g);return `<div class="w-full h-full"><svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" class="w-full h-full block" aria-hidden="true"><defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="400" height="260" fill="url(#${g})"/><circle cx="318" cy="66" r="34" fill="#fff" opacity=".35"/><path d="M0 190Q90 140 190 178T400 160V260H0Z" fill="#fff" opacity=".22"/><path d="M0 225Q110 185 220 218T400 205V260H0Z" fill="#3d3b3a" opacity=".1"/><g transform="translate(164 82) scale(3)" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".92">${ICONS[icon]||''}</g></svg></div>`}
const STAT={pending:['Pending approval','bg-sun/40 text-clay'],approved:['Approved','bg-mist text-forest'],rejected:['Rejected','bg-brick/10 text-brick'],suspended:['Suspended','bg-brick/10 text-brick'],active:['Active','bg-mist text-forest'],Active:['Active','bg-mist text-forest'],'Payment failed':['Payment failed','bg-brick/10 text-brick'],Incomplete:['Payment incomplete','bg-sun/40 text-clay'],Canceled:['Canceled','bg-beige text-bark/60'],published:['Published','bg-mist text-forest'],unpublished:['Unpublished','bg-beige text-bark/60']};
const stat=s=>{const [l,c]=STAT[s]||[s,'bg-beige'];return `<span class="chip ${c}">${l}</span>`};
const empty=(i,t,d,cta='')=>`<div class="text-center py-12 px-4"><div class="mx-auto w-14 h-14 rounded-2xl bg-beige text-forest grid place-items-center">${ic(i,'w-7 h-7')}</div><h3 class="font-head font-semibold text-pine mt-4">${t}</h3><p class="text-sm text-bark/60 mt-1 max-w-sm mx-auto">${d}</p>${cta?`<div class="mt-5 flex flex-wrap gap-2 justify-center">${cta}</div>`:''}</div>`;
const notice=(kind,html)=>{const k={ok:['bg-mist border-mint/40 text-pine','checkcircle'],warn:['bg-sun/30 border-sun text-bark','clock'],err:['bg-brick/10 border-brick/30 text-brick','alert'],info:['bg-beige border-sand text-bark','info']}[kind];return `<div class="rounded-2xl border p-4 flex gap-3 text-sm ${k[0]}" role="status"><span class="mt-0.5">${ic(k[1],'w-5 h-5')}</span><div class="min-w-0 flex-1">${html}</div></div>`};
const logo=(c='h-8')=>`<span class="inline-flex items-center gap-2"><svg viewBox="0 0 48 48" class="${c} w-auto" fill="none" aria-hidden="true"><path d="M8 22 24 8l16 14v18a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3z" stroke="#dbd670" stroke-width="3.5" stroke-linejoin="round" fill="#f1f0dc"/><path d="M24 38V27" stroke="#2f7a63" stroke-width="2.5" stroke-linecap="round"/><path d="M24 29c-6 0-8-4-8-7 5 0 8 2 8 7z" fill="#41ccb0"/><path d="M24 27c0-5 3-7 8-7 0 4-2 7-8 7z" fill="#2f7a63"/></svg><span class="font-display font-bold text-2xl text-pine leading-none">Mahali</span></span>`;
const money=n=>'AED '+Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const catName=id=>{const c=DB.cats.find(x=>x.id===id);return c?c.name:'—'};
const catOf=x=>x.cat==='c6'&&x.other?'Other: '+x.other:catName(x.cat);
const pageTitle=(t,s,act='')=>`<div class="flex flex-wrap items-end justify-between gap-3 mb-6"><div class="min-w-0"><h1 class="h1d text-2xl sm:text-3xl">${t}</h1>${s?`<p class="text-sm text-bark/65 mt-1 max-w-xl">${s}</p>`:''}</div>${act}</div>`;
const wrap=(h,w='max-w-7xl')=>`<div class="${w} mx-auto px-4 sm:px-6 py-6 sm:py-8">${h}</div>`;
const back=(h,l)=>`<a href="#${h}" class="inline-flex items-center gap-1.5 text-sm text-forest font-medium mb-4 hover:underline">${ic('arrowL','w-4 h-4')}${l}</a>`;

/* ── header (only SOW-required items, per role) ── */
const NAVS={
 visitor:[['/login','Log in','ghost'],['/vendor-register','Register as vendor','outline'],['/register','Register','secondary']],
 customer:[['/feedback','Feedback'],['/account','My account']],
 vendor:[['/dashboard/profile','Profile'],['/dashboard/listings','Listings'],['/dashboard/subscription','Subscription'],['/dashboard/feedback','Feedback']],
 admin:[['/admin','Overview'],['/admin/vendors','Vendors'],['/admin/customers','Customers'],['/admin/listings','Listings'],['/admin/categories','Categories']]};
const homeOf=()=>({visitor:'/',customer:'/',vendor:'/dashboard',admin:'/admin'}[role()]);

const imgGrid=k=>IMGS[k].map((s,i)=>`<div class="relative aspect-square rounded-lg overflow-hidden border border-sand"><img src="${s}" alt="Selected image ${i+1}" class="w-full h-full object-cover"><button data-act="rmImg" data-k="${k}" data-i="${i}" class="absolute top-1 right-1 w-6 h-6 rounded-full bg-white/95 grid place-items-center text-bark/70" aria-label="Remove image ${i+1}">${ic('x','w-3 h-3')}</button></div>`).join('');
I.img=t=>{const k=t.dataset.k,max=+t.dataset.max,err=$('#imgerr_'+k),msgs=[];[...t.files].forEach(f=>{
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){msgs.push(f.name+': use JPG, JPEG, PNG or WebP.');return}
  if(f.size>5*1024*1024){msgs.push(f.name+': larger than 5 MB.');return}
  if(IMGS[k].length>=max){if(!msgs.includes('You can add up to '+max+' images.'))msgs.push('You can add up to '+max+' images.');return}
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{if(im.width>4000||im.height>4000){err.textContent=f.name+': larger than 4,000 × 4,000 px.';err.classList.remove('hidden');return}if(IMGS[k].length<max){IMGS[k].push(r.result);$('#imgs_'+k).innerHTML=imgGrid(k)}};im.src=r.result};r.readAsDataURL(f)});
 err.textContent=msgs.join(' ');err.classList.toggle('hidden',!msgs.length);t.value=''};
A.rmImg=t=>{IMGS[t.dataset.k].splice(+t.dataset.i,1);$('#imgs_'+t.dataset.k).innerHTML=imgGrid(t.dataset.k)};

 else if(['Payment failed','Incomplete'].includes(v.sub))h+=notice('warn',`<b>Payment ${v.sub==='Incomplete'?'incomplete':'failed'}.</b> A payment status notification was sent to you and the Mahali administrator.`);
 if(v.upd)h+=notice('warn',`<b>Profile update pending approval.</b> Your current profile stays visible until the administrator approves the changes.`);

function lModal(l){IMGS.lf=[];modal(`${mHead(l.id?'Edit listing':'Add listing')}<div data-form="listing" data-id="${l.id||''}" class="space-y-4">${fld({n:'title',l:'Name / title',req:1,v:l.title,max:120})}${fld({n:'cat',l:'Category',req:1,opts:[['','Select a category'],...DB.cats.map(c=>[c.id,c.name])],v:l.cat,attr:'data-change="catOther"'})}<div id="otherWrap" class="${l.cat==='c6'?'':'hidden'}">${fld({n:'other',l:'Other category description',v:l.other,max:80})}</div>${fld({n:'desc',l:'Description',req:1,rows:4,v:l.desc,max:2000})}${fld({n:'price',l:'Price (AED)',v:l.price!=null?l.price:'',ph:'25.50',hint:'Optional. Up to two decimal places.'})}${imgZone('lf',5,0,'Images')}<button data-act="submit" class="btn btn-primary w-full">${l.id?'Save changes':'Add listing'}</button></div>`,{w:'sm:max-w-lg'})}
A.lAdd=()=>lModal({});A.lEdit=t=>lModal(DB.listings.find(l=>l.id===t.dataset.id));
F.listing=c=>{const d=check(c,{title:['req',rw],cat:['req'],other:[(v,d)=>d.cat==='c6'&&!v?'Describe the category.':'',rw],desc:['req',rw],price:['price']});if(!d)return;const o={title:d.title.trim(),cat:d.cat,other:d.cat==='c6'?d.other.trim():'',desc:d.desc.trim(),price:d.price===''?null:parseFloat(d.price)};
 if(c.dataset.id)Object.assign(DB.listings.find(l=>l.id===c.dataset.id),o);else DB.listings.push({id:'l'+(DB.listings.length+1),vid:me().id,hue:DB.listings.length%7,status:'published',...o});
 closeModal();toast(c.dataset.id?'Listing updated.':'Listing added.');$('#llist').innerHTML=listHtml()};
A.lDel=t=>{const l=DB.listings.find(x=>x.id===t.dataset.id);confirmBox({title:'Remove this listing?',text:esc(l.title)+' will no longer appear on your profile.',label:'Remove listing',danger:true,ok:()=>{DB.listings=DB.listings.filter(x=>x.id!==l.id);toast('Listing removed.');$('#llist').innerHTML=listHtml()}})};

/* subscription (Stripe) */
const subNote={Active:'Your subscription is active.','Payment failed':'Your last payment failed.',Incomplete:'Your payment has not been completed.',Canceled:'Your subscription was canceled.'};
route('/dashboard/subscription',()=>VEN()||(v=>({title:'Subscription',html:dash('Subscription','Your vendor subscription and payment status.',`<div class="card card-shadow p-5 mb-6"><div class="flex flex-wrap items-center gap-3"><h2 class="font-head font-semibold text-pine">Status</h2>${stat(v.sub||'Incomplete')}</div><p class="text-sm text-bark/70 mt-2">${subNote[v.sub||'Incomplete']}</p>${v.sub==='Active'?`<p class="text-sm mt-2"><span class="text-bark/60">Current billing period ends:</span> <b>${esc(v.billEnd)}</b></p>`:''}</div>
 <h2 class="font-head font-semibold text-pine mb-3">Subscription plans</h2><div class="grid sm:grid-cols-2 gap-4">${DB.plans.map(p=>`<div class="card card-shadow p-5 flex flex-col"><h3 class="font-head font-semibold text-pine">${p.name}</h3><p class="text-sm text-bark/60">${p.dur}</p><p class="font-head font-bold text-2xl text-pine mt-3">AED xxx</p><p class="text-[11px] text-bark/50 mb-4">Placeholder price — plans and prices to be confirmed by Mahali.</p><button data-act="plan" data-id="${p.id}" class="btn btn-primary mt-auto">${v.sub==='Active'?'Change plan':'Subscribe'}</button></div>`).join('')}</div>`)}))(me()));
A.plan=t=>{const p=DB.plans.find(x=>x.id===t.dataset.id);modal(`${mHead('Continue to payment',p.name)}<div class="card p-4 text-sm">${ic('card','w-5 h-5 text-forest mb-2')}<p>You will be directed to Stripe to complete your payment securely.</p></div><p class="text-[11px] text-bark/50 mt-3">Prototype: choose the payment outcome returned by Stripe.</p><div class="grid gap-2 mt-3"><button data-act="pay" data-ok="1" class="btn btn-primary">Payment successful</button><button data-act="pay" data-ok="0" class="btn btn-outline">Payment failed</button></div>`)};
A.pay=t=>{const v=me();closeModal();if(t.dataset.ok==='1'){v.sub='Active';v.billEnd='21 Oct 2026';if(susp(v))v.canReinstate=true;toast(susp(v)?'Payment received. You can now reinstate your account.':'Payment received. Your subscription is active.')}else{v.sub='Payment failed';toast('Payment failed. A notification was sent to you and the Mahali administrator.','err')}rerender()};

route('/dashboard/feedback',()=>VEN()||feedbackPage('vendor',me().name));
/* ══════════ Admin panel ══════════ */
const ADM=()=>gate(['admin'],'administrators');
const row=(inner)=>`<div class="card p-4 flex flex-wrap items-center gap-x-4 gap-y-3">${inner}</div>`;
const stat2=(l,v,s='')=>`<div class="card card-shadow p-4 min-w-0"><p class="text-sm text-bark/60">${l}</p><p class="font-head font-semibold text-3xl text-pine mt-1">${v}</p>${s?`<p class="text-xs text-bark/55 mt-1">${s}</p>`:''}</div>`;
route('/admin',()=>ADM()||(()=>{const V=DB.vendors,C=DB.customers,pa=V.filter(v=>v.status==='pending').length,pu=V.filter(v=>v.upd).length,ret=C.filter(c=>c.logins>1).length,nw=C.filter(c=>c.logins===1).length;
 return{title:'Overview',html:wrap(`${pageTitle('Overview','Basic counts from the platform.')}<h2 class="font-head font-semibold text-pine mb-3">Vendors</h2><div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">${stat2('Total vendors',V.length)}${stat2('Active vendors',V.filter(v=>v.status==='approved').length)}${stat2('Suspended vendors',V.filter(v=>v.status==='suspended').length)}${stat2('Pending approvals',pa+pu,pa+' applications · '+pu+' profile updates')}${stat2('Approved applications',V.filter(v=>['approved','suspended'].includes(v.status)).length)}${stat2('Rejected applications',V.filter(v=>v.status==='rejected').length)}</div>
 <h2 class="font-head font-semibold text-pine mb-3">Customers</h2><div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${stat2('Registered customers',C.length)}${stat2('Customers who have logged in',C.filter(c=>c.logins>0).length)}${stat2('New customers',nw,'Logged in once')}${stat2('Returning customers',ret,'Logged in more than once')}</div>`)}})());

/* vendors */
let AV='all';
const vList=()=>{const L=DB.vendors.filter(v=>AV==='all'||(AV==='pending'?(v.status==='pending'||v.upd):v.status===AV));return L.length?`<div class="space-y-3">${L.map(v=>row(`<div class="flex-1 min-w-[12rem]"><p class="font-head font-semibold text-pine break-words">${esc(v.name)}</p><p class="text-xs text-bark/60 mt-0.5">${esc(catOf(v))} · ${esc(v.address)}</p></div><div class="flex flex-wrap items-center gap-2">${stat(v.status)}${v.sub?stat(v.sub):''}${v.upd?`<span class="chip !bg-sun/40 text-clay">Profile update pending</span>`:''}</div><button data-act="vView" data-id="${v.id}" class="btn btn-outline btn-sm">View</button>`)).join('')}</div>`:empty('store','No vendors here','There are no vendors with this status.')};
route('/admin/vendors',()=>ADM()||(AV='all',{title:'Vendors',html:wrap(`${pageTitle('Vendors','Review applications and manage vendor accounts.')}<div id="vtabs" class="flex flex-wrap gap-2 mb-5">${[['all','All'],['pending','Pending'],['approved','Approved'],['rejected','Rejected'],['suspended','Suspended']].map(([k,l])=>`<button data-act="vtab" data-k="${k}" aria-pressed="${k==='all'}" class="chip ${k==='all'?'chip-on':'!bg-white border border-sand hover:bg-mist'} !py-2">${l}</button>`).join('')}</div><div id="vlist">${vList()}</div>`)}));
A.vtab=t=>{AV=t.dataset.k;$$('#vtabs button').forEach(b=>{const on=b===t;b.classList.toggle('chip-on',on);b.classList.toggle('!bg-white',!on);b.classList.toggle('border',!on);b.setAttribute('aria-pressed',on)});$('#vlist').innerHTML=vList()};
const kv=(k,v)=>`<div class="min-w-0"><dt class="text-xs text-bark/50">${k}</dt><dd class="text-sm font-medium break-words">${v||'—'}</dd></div>`;
A.vView=t=>{const v=vendor(t.dataset.id),mode=v.status==='pending'?'app':v.upd?'upd':'';
 const diff=v.upd?`<section class="mt-5"><h3 class="font-head font-semibold text-pine text-sm mb-2">Requested profile changes</h3>${['desc','address','name','phone','wa','email','web'].filter(k=>v.upd[k]!==undefined&&v.upd[k]!==v[k]).map(k=>`<div class="grid sm:grid-cols-2 gap-2 mb-2"><div class="rounded-xl bg-beige/70 p-3"><p class="text-xs text-bark/50">Current ${k==='desc'?'description':k}</p><p class="text-sm break-words">${esc(v[k])}</p></div><div class="rounded-xl bg-mist p-3"><p class="text-xs text-forest">Proposed</p><p class="text-sm break-words">${esc(v.upd[k])}</p></div></div>`).join('')}</section>`:'';
 const decide=mode?`<div data-form="vdec" data-id="${v.id}" data-mode="${mode}" class="mt-5 space-y-3"><div class="grid grid-cols-2 gap-2">${[['approve',mode==='app'?'Approve':'Approve update'],['reject',mode==='app'?'Reject':'Reject update']].map(([x,l],i)=>`<label class="card p-2.5 text-center text-sm font-head font-medium cursor-pointer has-[:checked]:border-forest has-[:checked]:bg-mist"><input type="radio" name="dec" value="${x}" ${i?'':'checked'} class="sr-only">${l}</label>`).join('')}</div>${fld({n:'reason',l:'Reason for rejection',rows:3,hint:'Required if rejecting. The vendor is notified with this reason.'})}<button data-act="submit" class="btn btn-primary w-full">Confirm</button></div>`
  :v.status==='approved'?`<button data-act="vSusp" data-id="${v.id}" class="btn btn-danger w-full mt-5">Suspend account</button>`:v.status==='suspended'?`<button data-act="vReact" data-id="${v.id}" class="btn btn-primary w-full mt-5">Reactivate account</button>`:'';
 modal(`${mHead(esc(v.name),'Vendor application and account')}<div class="flex flex-wrap gap-2 mb-4">${stat(v.status)}${v.sub?stat(v.sub):''}</div><dl class="grid sm:grid-cols-2 gap-4">${kv('Category',esc(catOf(v)))}${kv('Address',esc(v.address))}${kv('Phone',esc(v.phone))}${kv('WhatsApp',esc(v.wa))}${kv('Email',esc(v.email))}${kv('Website',esc(v.web))}${kv('Contact options shown',v.methods.map(m=>CONTACT[m][0]).join(', '))}${kv('Profile images',String(v.imgs))}${v.sub?kv('Subscription',esc(v.sub)):''}${v.sub==='Active'?kv('Billing period ends',esc(v.billEnd)):''}<div class="sm:col-span-2">${kv('Description',esc(v.desc))}</div>${v.status==='rejected'?`<div class="sm:col-span-2">${kv('Rejection reason',esc(v.reason))}</div>`:''}</dl>${diff}${decide}`,{w:'sm:max-w-2xl'})};
F.vdec=c=>{const d=collect(c),v=vendor(c.dataset.id),reject=d.dec==='reject';if(reject&&!(d.reason||'').trim()){const e=$('[data-err=reason]',c);e.textContent='Add a reason so the vendor knows what to fix.';e.classList.remove('hidden');return}
 if(c.dataset.mode==='app'){if(reject){v.status='rejected';v.reason=d.reason.trim();toast('Application rejected. The vendor was notified with the reason.')}else{v.status='approved';v.sub='Incomplete';v.justApproved=true;toast('Application approved. The vendor was notified.')}}
 else{if(reject){v.updReject=d.reason.trim();v.upd=null;toast('Update rejected. The vendor was notified with the reason.')}else{const u=v.upd;['name','cat','other','desc','address','phone','wa','email','web','methods'].forEach(k=>{if(u[k]!==undefined)v[k]=u[k]});v.upd=null;v.updReject='';toast('Update approved. The new profile is live.')}}
 closeModal();$('#vlist').innerHTML=vList()};
A.vSusp=t=>{const v=vendor(t.dataset.id);closeModal();confirmBox({title:'Suspend '+esc(v.name)+'?',text:'The vendor will be hidden from the platform. Their data is kept.',label:'Suspend account',danger:true,ok:()=>{v.status='suspended';toast('Account suspended.');$('#vlist').innerHTML=vList()}})};
A.vReact=t=>{const v=vendor(t.dataset.id);v.status='approved';closeModal();toast('Account reactivated.');$('#vlist').innerHTML=vList()};

/* customers */
const cList=()=>`<div class="space-y-3">${DB.customers.map(c=>row(`<div class="flex-1 min-w-[12rem]"><p class="font-head font-semibold text-pine">${esc(c.first+' '+c.last)}</p><p class="text-xs text-bark/60 mt-0.5 break-all">${esc(c.email)} · ${esc(c.emirate)} · ID ${esc(c.uid)}</p></div>${stat(c.status)}<button data-act="cTog" data-id="${c.id}" class="btn btn-outline btn-sm">${c.status==='active'?'Suspend':'Activate'}</button>`)).join('')}</div>`;
route('/admin/customers',()=>ADM()||{title:'Customers',html:wrap(`${pageTitle('Customers','View customer accounts and manage account status.')}<div id="clist">${cList()}</div>`)});
A.cTog=t=>{const c=DB.customers.find(x=>x.id===t.dataset.id),on=c.status==='active';confirmBox({title:(on?'Suspend ':'Activate ')+esc(c.first+' '+c.last)+'?',text:on?'They will not be able to use their account.':'They will be able to use their account again.',label:on?'Suspend':'Activate',danger:on,ok:()=>{c.status=on?'suspended':'active';toast('Customer account '+(on?'suspended.':'activated.'));$('#clist').innerHTML=cList()}})};

/* listings */
const aList=()=>DB.listings.length?`<div class="space-y-3">${DB.listings.map(l=>row(`<div class="w-14 h-14 rounded-xl overflow-hidden shrink-0">${art(l.hue,'tag')}</div><div class="flex-1 min-w-[12rem]"><p class="font-head font-semibold text-pine break-words">${esc(l.title)}</p><p class="text-xs text-bark/60 mt-0.5">${esc(vendor(l.vid).name)} · ${esc(catOf(l))} · ${l.price!=null?money(l.price):'Price on request'}</p></div>${stat(l.status)}<div class="flex gap-2"><button data-act="aTog" data-id="${l.id}" class="btn btn-outline btn-sm">${l.status==='published'?'Unpublish':'Publish'}</button><button data-act="aDel" data-id="${l.id}" class="btn btn-outline btn-sm !text-brick !border-brick/40" aria-label="Remove ${esc(l.title)}">${ic('trash','w-4 h-4')}</button></div>`)).join('')}</div>`:empty('tag','No listings','Vendor listings will appear here.');
route('/admin/listings',()=>ADM()||{title:'Listings',html:wrap(`${pageTitle('Product & service listings','View listings and manage their status.')}<div id="alist">${aList()}</div>`)});
A.aTog=t=>{const l=DB.listings.find(x=>x.id===t.dataset.id);l.status=l.status==='published'?'unpublished':'published';toast('Listing '+l.status+'.');$('#alist').innerHTML=aList()};
A.aDel=t=>{const l=DB.listings.find(x=>x.id===t.dataset.id);confirmBox({title:'Remove this listing?',text:esc(l.title)+' will be removed from the vendor profile.',label:'Remove listing',danger:true,ok:()=>{DB.listings=DB.listings.filter(x=>x.id!==l.id);toast('Listing removed.');$('#alist').innerHTML=aList()}})};

/* categories */
const catList=()=>`<div class="space-y-3">${DB.cats.map(c=>row(`<div class="flex-1 min-w-[10rem]"><p class="font-head font-semibold text-pine">${esc(c.name)}</p></div>${c.id==='c6'?'':`<button data-act="catEdit" data-id="${c.id}" class="btn btn-outline btn-sm">${ic('edit','w-4 h-4')}Edit</button><button data-act="catDel" data-id="${c.id}" class="btn btn-outline btn-sm !text-brick !border-brick/40" aria-label="Delete ${esc(c.name)}">${ic('trash','w-4 h-4')}</button>`}`)).join('')}</div>`;
route('/admin/categories',()=>ADM()||{title:'Categories',html:wrap(`${pageTitle('Categories','Categories used for vendors and products / services.')}<div data-form="catAdd" class="flex gap-2 mb-5 max-w-lg"><div class="flex-1 min-w-0">${fld({n:'name',l:'New category name',ph:'e.g. Pet Services'})}</div><button data-act="submit" class="btn btn-primary self-end">${ic('plus','w-4 h-4')}Add</button></div><div id="catlist">${catList()}</div>`,'max-w-3xl')});
F.catAdd=c=>{const d=check(c,{name:['req',(v)=>DB.cats.some(x=>x.name.toLowerCase()===v.toLowerCase())?'This category already exists.':'']});if(!d)return;DB.cats.splice(DB.cats.length-1,0,{id:'c'+Date.now(),name:d.name.trim()});$('[name=name]',c).value='';toast('Category added.');$('#catlist').innerHTML=catList()};
A.catEdit=t=>{const c=DB.cats.find(x=>x.id===t.dataset.id);modal(`${mHead('Edit category')}<div data-form="catEdit" data-id="${c.id}" class="space-y-3">${fld({n:'name',l:'Category name',req:1,v:c.name})}<button data-act="submit" class="btn btn-primary w-full">Save</button></div>`)};
F.catEdit=c=>{const d=check(c,{name:['req']});if(!d)return;DB.cats.find(x=>x.id===c.dataset.id).name=d.name.trim();closeModal();toast('Category updated.');$('#catlist').innerHTML=catList()};
A.catDel=t=>{const c=DB.cats.find(x=>x.id===t.dataset.id),n=DB.listings.filter(l=>l.cat===c.id).length+DB.vendors.filter(v=>v.cat===c.id).length;
 if(n)return confirmBox({title:'Category in use',text:esc(c.name)+' is used by '+n+' vendor(s) or listing(s) and cannot be deleted.',label:'OK',ok:()=>{}});
 confirmBox({title:'Delete '+esc(c.name)+'?',text:'This category will be removed.',label:'Delete',danger:true,ok:()=>{DB.cats=DB.cats.filter(x=>x.id!==c.id);toast('Category deleted.');$('#catlist').innerHTML=catList()}})};

/* ══════════ Prototype reviewer control (not part of the product UI) ══════════ */
A.demo=()=>{const cur=!S.user?'visitor':S.user.role==='vendor'?(S.user.vid==='v9'?'vendor-pending':S.user.vid==='v10'?'vendor-rejected':S.user.vid==='v6'?'vendor-suspended':'vendor'):S.user.role;
 modal(`${mHead('Prototype: view as','Reviewer control — not part of the product.')}<div class="grid gap-2">${[['visitor','Visitor'],['customer','Customer'],['vendor','Vendor — approved'],['vendor-pending','Vendor — application pending'],['vendor-rejected','Vendor — application rejected'],['vendor-suspended','Vendor — suspended (payment)'],['admin','Admin']].map(([k,l])=>`<button data-act="role" data-r="${k}" class="btn ${cur===k?'btn-primary':'btn-outline'} justify-start">${l}</button>`).join('')}</div>`)};
A.role=t=>{const r=t.dataset.r;S.user=DEMO[r]?{...DEMO[r]}:null;persist();closeModal();location.hash='#'+homeOf();nav()};
(function(){const b=document.createElement('button');b.dataset.act='demo';b.setAttribute('aria-label','Prototype: view as another role');b.className='btn btn-secondary btn-sm shadow-lg fixed z-[60] left-3 bottom-3 !rounded-full';b.innerHTML=ic('eye','w-4 h-4')+'Prototype';document.body.appendChild(b);
 if(!location.hash)location.hash='#/';nav()})();
</script>
</body>
</html>
